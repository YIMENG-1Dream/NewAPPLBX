plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.destinationovo.weblxbapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.destinationovo.weblxbapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        
        // 软件编号
        buildConfigField "String", "APP_SERIAL", "\"LXB2025001\""
        buildConfigField "String", "DEVELOPER_NAME", "\"Destination_ovo\""
        buildConfigField "String", "APP_NAME", "\"六边形计算器\""
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'
        }
    }
    
    signingConfigs {
        release {
            storeFile file('../app-release-key.jks')
            storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: "weblxbapp"
            keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: "android"
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}